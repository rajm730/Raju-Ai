name: Android CI

on:
  push:
    branches: [ "main", "ccr-*", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          total = failed = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(path).read())
              if m:
                  total += int(m[1]); skipped += int(m[2]); failed += int(m[3]) + int(m[4])
          print(f"UNIT TESTS: total={total} failed={failed} skipped={skipped}")
          PY

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build release APK (unsigned; checks R8/ProGuard rules)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: raju-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # Every update of main publishes the debug APK as a GitHub Release, so it can be downloaded on
  # the phone directly (no GitHub login, no Actions artifact, nothing to pay):
  # https://github.com/<owner>/<repo>/releases/latest
  publish-apk:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: raju-ai-debug-apk
          path: apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk Seema-AI.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Seema-AI.apk \
            --target "$GITHUB_SHA" \
            --title "Seema AI — latest build" \
            --notes "Debug APK built from main (${GITHUB_SHA::7}). On the phone: download Seema-AI.apk, open it, allow 'Install unknown apps' when asked. API keys are entered in the app, none are inside the APK." \
            --latest
